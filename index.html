<script>
/* Livestock Market Analyzer — Views: Seasonal Index + Cross-Market Comparison
   Client-side v1 (decision 2026-07-04). Loads data/ files directly.
   Species-first navigation; multi-series overlay in the comparison view. */

const {
  useState,
  useEffect,
  useMemo,
  useRef
} = React;

/* ---------- market registry (species-first) ---------- */
const MARKETS = [

// sheep / goat tradeable barns (shared reports; species split per-row)
{

  loc: "Pawnee, OK",

  tier: "tradeable"
}, {
  group: "diamond",
  slug: 1805,
  label: "Diamond (TS White)",
  loc: "Diamond, MO",
  species: "sheep_goat",
  tier: "tradeable"
}, {
  group: "norwood",
  slug: 1806,
  label: "Norwood",
  loc: "Norwood, MO",
  species: "sheep_goat",
  tier: "tradeable"
}, {
  group: "buffalo",
  slug: 1804,
  label: "Buffalo",
  loc: "Buffalo, MO",
  species: "sheep_goat",
  tier: "tradeable"
}, {
  group: "salem",
  slug: 3659,
  label: "Salem",
  loc: "Salem, AR",
  species: "sheep_goat",
  tier: "tradeable"
}, {
  group: "mo_sheep_goat_summary",
  slug: 1833,
  label: "Missouri Summary",
  loc: "MO",
  species: "sheep_goat",
  tier: "context"
}];

// species tabs map to a row-level filter, since sheep/goat share one report
const SPECIES = [{
  key: "cattle",
  label: "Cattle",
  rowSpecies: ["cattle"]
}, {
  key: "sheep",
  label: "Sheep",
  rowSpecies: ["sheep"]
}, {
  key: "goat",
  label: "Goats",
  rowSpecies: ["goat"]
}];
// which market groups carry a given species' rows
function marketsForSpecies(sp) {
  const grp = sp === "cattle" ? "cattle" : "sheep_goat";
  return MARKETS.filter(m => m.species === grp);
}
// default comparison barn set per species
const DEFAULT_COMPARE = {
  cattle: ["tulsa", "joplin", "mcalester", "okc_west", "okc_national"],
  sheep: ["pawnee", "diamond", "norwood", "salem"],
  goat: ["pawnee", "diamond", "norwood", "salem"]
};
const DATA_BASES = ["data/", "https://raw.githubusercontent.com/odellnoah-svg/livestock-market-analyzer/main/data/"];
const CURRENT_YEAR = 2026;

// distinct, legible series colors (up to 8)
const SERIES_COLORS = ["#c26a2b", "#3f7d8c", "#7a9a3e", "#9a5a8c", "#b8912a", "#5a7b9a", "#8a5a3a", "#4a8a6a"];

/* ---------- helpers ---------- */
function isoWeek(dateStr) {
  const [m, d, y] = dateStr.split("/").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const day = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  const wk = Math.ceil(((dt - yearStart) / 86400000 + 1) / 7);
  return {
    year: dt.getUTCFullYear(),
    week: wk
  };
}
function parseDate(s) {
  const [m, d, y] = s.split("/").map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
const wkKey = (y, w) => y * 100 + w;
const fmt$ = v => v == null ? "—" : v.toLocaleString("en-US", {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});
function wtBreak(r) {
  if (r.wt_break_lo != null) return r.wt_break_lo;
  if (r.wt_avg) return Math.floor(r.wt_avg / 50) * 50;
  return null;
}
async function fetchJSON(path) {
  let lastErr;
  for (const base of DATA_BASES) {
    try {
      const r = await fetch(base + path);
      if (r.ok) return await r.json();
      lastErr = new Error(r.status + " " + path);
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr;
}

/* ---------- shared multi-group loader ---------- */
function useMarketData(groups) {
  const [cache, setCache] = useState({}); // group -> rows
  const [loading, setLoading] = useState(null);
  const [error, setError] = useState(null);
  const manifestRef = useRef(null);
  useEffect(() => {
    const need = groups.filter(g => g && !cache[g]);
    if (!need.length) return;
    let dead = false;
    (async () => {
      try {
        setError(null);
        if (!manifestRef.current) manifestRef.current = await fetchJSON("index.json");
        const manifest = manifestRef.current;
        for (const g of need) {
          const files = manifest.files.filter(f => f.file.split("/")[1] === g);
          const rows = [];
          for (let i = 0; i < files.length; i++) {
            if (dead) return;
            setLoading({
              group: g,
              done: i,
              total: files.length
            });
            const part = await fetchJSON(files[i].file.replace(/^data\//, ""));
            rows.push(...part);
          }
          if (dead) return;
          setCache(c => ({
            ...c,
            [g]: rows
          }));
        }
        if (!dead) setLoading(null);
      } catch (e) {
        if (!dead) {
          setError(String(e));
          setLoading(null);
        }
      }
    })();
    return () => {
      dead = true;
    };
  }, [groups.join(",")]);
  return {
    cache,
    loading,
    error
  };
}

/* ---------- seasonal index math (unchanged, carried forward) ---------- */
function weeklySeries(rows, filt) {
  const acc = new Map();
  for (const r of rows) {
    if (!filt(r)) continue;
    const {
      year,
      week
    } = isoWeek(r.date);
    const k = wkKey(year, week);
    const a = acc.get(k) || [0, 0];
    a[0] += r.price_avg * r.head;
    a[1] += r.head;
    acc.set(k, a);
  }
  const out = [];
  for (const [k, [s, h]] of acc) if (h > 0) out.push({
    k,
    year: Math.floor(k / 100),
    week: k % 100,
    price: s / h,
    head: h
  });
  out.sort((a, b) => a.k - b.k);
  return out;
}
function seasonalIndex(series, lookback) {
  const minYear = CURRENT_YEAR - lookback;
  const yearWeeks = new Map();
  for (const p of series) if (p.year < CURRENT_YEAR && p.year >= minYear) yearWeeks.set(p.year, (yearWeeks.get(p.year) || 0) + 1);
  const cadence = [...yearWeeks.values()].sort((a, b) => a - b);
  const medianWeeks = cadence.length ? cadence[Math.floor(cadence.length / 2)] : 0;
  const minWindow = Math.max(8, Math.round(medianWeeks * 0.6));
  const ratios = [];
  const n = series.length;
  const serial = p => p.year * 52 + p.week;
  for (let i = 0; i < n; i++) {
    const p = series[i];
    if (p.year >= CURRENT_YEAR || p.year < minYear) continue;
    const lo = serial(p) - 26,
      hi = serial(p) + 26;

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Seasonal Index — Livestock Market Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root{
  --ink:#26241f;          /* dark warm charcoal */
  --ink-soft:#5c584f;
  --paper:#f4f3ef;        /* cool working-paper */
  --card:#fbfaf7;
  --steel:#66727a;        /* historical band */
  --steel-soft:#66727a2b;
  --tag:#e8a013;          /* ear-tag yellow */
  --tag-deep:#b97f0a;
  --clay:#a8502c;         /* highs / caution */
  --grass:#5c7a4a;        /* lows / opportunity */
  --rule:#d9d6cd;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1060px;margin:0 auto;padding:26px 22px 46px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
  border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:26px;height:auto;flex:0 0 auto;overflow:visible}
.brand-mark path{fill:var(--tag);stroke:var(--tag-deep);stroke-width:2.4}
.brand-mark circle{fill:var(--paper);stroke:var(--tag-deep);stroke-width:2.4}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:30px;letter-spacing:.4px;
  margin:0;text-transform:uppercase}
.sub{color:var(--ink-soft);font-size:13px;margin-top:1px}
.method{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft);text-align:right}
.species-tabs{display:flex;gap:2px;margin-bottom:0;border-bottom:2px solid var(--ink)}
.species-tab{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:.5px;
  text-transform:uppercase;padding:9px 22px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;
  border-radius:6px 6px 0 0;position:relative;top:2px}
.species-tab.on{background:var(--ink);color:var(--paper)}
.species-tab:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
.view-tabs{display:flex;gap:16px;margin:16px 0 14px}
.view-tab{font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:14px;padding:6px 2px;border:none;
  background:transparent;color:var(--ink-soft);cursor:pointer;border-bottom:2.5px solid transparent}
.view-tab.on{color:var(--ink);border-bottom-color:var(--tag)}
.view-tab:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
.barn-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-family:"IBM Plex Sans",sans-serif;font-weight:500;font-size:13px;padding:5px 12px;border:1.5px solid var(--rule);
  border-radius:16px;background:var(--card);color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{font-weight:600;background:var(--paper)}
.chip:focus-visible{outline:2px solid var(--tag);outline-offset:1px}
.chip-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.cmp-line{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.wt-guide{stroke:var(--ink-soft);stroke-width:1.5;stroke-dasharray:4 4;opacity:.6}
.wt-hit{fill:transparent;cursor:pointer}
.wt-hit:hover{fill:var(--ink);opacity:.04}
.tick-x.tick-sel{font-weight:700;fill:var(--ink)}
.cmp-dot{stroke:var(--card);stroke-width:1.5;cursor:pointer;pointer-events:none}
.dot-halo{fill:transparent;cursor:pointer}
.chart-tip .tip-box{fill:var(--ink);opacity:.97}
.chart-tip .tip-lead{stroke:var(--ink-soft);stroke-width:1;opacity:.5}
.chart-tip .tip-barn{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.4px;text-transform:uppercase;fill:var(--paper)}
.chart-tip .tip-price{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;fill:#fff}
.chart-tip .tip-unit{font-size:11px;fill:var(--rule)}
.chart-tip .tip-meta{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;fill:var(--rule)}
.cmp-dot.hi{stroke:var(--ink);stroke-width:2}
.rank{margin-top:16px;background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:14px 16px}
.rank-head{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.rank-tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.rank-tbl td{padding:7px 6px;border-bottom:1px solid var(--rule)}
.rank-tbl tr:last-child td{border-bottom:none}
.rank-tbl tr.top td{font-weight:600}
.rank-tbl .rk{width:22px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace}
.rank-tbl .bn{display:flex;align-items:center;gap:8px}
.rank-tbl .pr{font-family:"IBM Plex Mono",monospace;text-align:right;white-space:nowrap}
.rank-tbl .pr .unit{font-size:11px;color:var(--ink-soft);margin-left:2px}
.rank-tbl .hd{text-align:right;color:var(--ink-soft);font-size:12.5px;white-space:nowrap}
.rank-tbl .delta{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--clay);width:56px}
.rank-tbl tr.top .delta{color:var(--grass)}
.add-btn{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.5px;
  text-transform:uppercase;padding:8px 16px;border:1.5px solid var(--ink);border-radius:5px;background:var(--ink);
  color:var(--paper);cursor:pointer;align-self:flex-end}
.add-btn:disabled{opacity:.4;cursor:not-allowed}
.add-btn:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
.explore-toggles{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
  padding:10px 14px;background:var(--card);border:1.5px solid var(--rule);border-radius:8px}
.explore-toggles .seg{display:flex;align-items:center;gap:7px;font-family:"Barlow Semi Condensed",sans-serif;
  font-weight:600;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft)}
.explore-toggles .seg select{font-family:"IBM Plex Sans",sans-serif;font-size:13px;padding:5px 8px;
  border:1.5px solid var(--ink);border-radius:5px;background:var(--paper);text-transform:none}
.explore-toggles .chk{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink)}
.explore-toggles .chk input{width:16px;height:16px;accent-color:var(--tag-deep)}
.clear-btn{margin-left:auto;font-size:12.5px;padding:5px 12px;border:1.5px solid var(--rule);border-radius:5px;
  background:var(--paper);color:var(--ink-soft);cursor:pointer}
.clear-btn:hover{border-color:var(--clay);color:var(--clay)}
.explore-legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;min-height:24px}
.ex-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 6px 4px 10px;
  border:1.5px solid var(--rule);border-radius:16px;background:var(--card)}
.ex-x{border:none;background:transparent;color:var(--ink-soft);font-size:17px;line-height:1;cursor:pointer;
  padding:0 4px;border-radius:50%}
.ex-x:hover{color:var(--clay)}
.explore-legend .hint{font-size:13px;color:var(--ink-soft);font-style:italic}
.grid-faint{stroke:var(--rule);opacity:.5}
.info-tier{margin-bottom:26px}
.info-tier-head{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.7px;
  text-transform:uppercase;color:var(--ink);margin:0 0 8px;padding-bottom:5px;border-bottom:2px solid var(--rule)}
.info-tbl-wrap{overflow-x:auto}
.info-tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.info-tbl th{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:11px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:6px 10px;border-bottom:1.5px solid var(--rule)}
.info-tbl td{padding:8px 10px;border-bottom:1px solid var(--rule)}
.info-tbl tr:last-child td{border-bottom:none}
.info-tbl tr.pending td{color:var(--ink-soft);opacity:.7}
.info-tbl .c-rk{width:26px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace}
.info-tbl .c-name{font-weight:600;white-space:nowrap}
.info-tbl .c-num{text-align:right;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.info-tbl .c-slug{font-family:"IBM Plex Mono",monospace;color:var(--ink-soft);text-align:right}
.info-tbl .c-day,.info-tbl .c-yrs,.info-tbl .c-sp{white-space:nowrap;color:var(--ink-soft)}
.depth-flag{display:inline-block;font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.4px;text-transform:uppercase;color:var(--tag-deep);background:#f3e3c3;border:1px solid var(--tag-deep);
  padding:1px 5px;border-radius:8px;margin-left:7px;vertical-align:1px}
.info-tbl .pend{font-style:italic;font-size:12px;color:var(--ink-soft)}
.us-map-wrap{margin-bottom:20px}
.us-map{width:100%;height:auto;background:var(--card);border:1.5px solid var(--rule);border-radius:8px}
.map-bg{fill:#eceae4}
.map-states{fill:#f8f7f3;stroke:#cfccc3;stroke-width:0.6;stroke-linejoin:round}
.map-cap{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--ink-soft);opacity:.6}
.map-pin .pin-dot{stroke:var(--card);stroke-width:1}
.pin-barn{fill:var(--clay)}
.pin-ctx{fill:var(--steel)}
.pin-on{stroke:var(--ink);stroke-width:2}
.pin-label{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:12px;fill:var(--ink);
  paint-order:stroke;stroke:var(--card);stroke-width:3px}
.map-legend{display:flex;gap:18px;align-items:center;margin-top:8px;font-size:13px;color:var(--ink-soft)}
.pin-swatch{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
.pin-swatch.pin-barn{background:var(--clay)}
.pin-swatch.pin-ctx{background:var(--steel)}
.map-hint{margin-left:auto;font-style:italic;font-size:12px}
.info-tbl tr.row-sel td{background:#f3e3c3}
.species-filter{display:flex;gap:8px;margin-bottom:14px}
.sf-btn{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.5px;
  text-transform:uppercase;padding:6px 16px;border:1.5px solid var(--rule);border-radius:16px;
  background:var(--card);color:var(--ink-soft);cursor:pointer}
.sf-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sf-btn:focus-visible{outline:2px solid var(--tag);outline-offset:1px}
.stat-swing{background:#f6efe0;border-color:var(--tag-deep)}
.caveat{color:var(--clay);font-style:italic}
.cls-multi{display:flex;flex-direction:column;gap:2px;position:relative}
.cls-lbl{font-family:"Barlow Semi Condensed",sans-serif;font-size:12px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--ink-soft)}
.cls-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:130px;
  font-family:inherit;font-size:14px;padding:7px 11px;border:1.5px solid var(--rule);border-radius:6px;
  background:var(--card);color:var(--ink);cursor:pointer}
.cls-trigger:disabled{opacity:.5;cursor:default}
.cls-trigger.open{border-color:var(--ink)}
.sw-line{vertical-align:middle;margin-right:6px;background:transparent}
.legend-cmp{gap:18px;font-size:13px;color:var(--ink)}
.legend-cmp span{display:inline-flex;align-items:center;background:transparent}
.legend-cmp .sw-line{background:transparent}
.grades-view{max-width:820px;line-height:1.55}
.grades-intro{font-size:15px;color:var(--ink);margin-bottom:22px}
.grades-h{font-family:"Barlow Semi Condensed",sans-serif;font-size:20px;font-weight:700;color:var(--ink);
  margin:28px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--rule)}
.grades-p{font-size:14px;color:var(--ink);margin-bottom:14px}
.muscle-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px;
  padding:18px;background:var(--card);border:1.5px solid var(--rule);border-radius:10px}
.muscle-fig{margin:0;text-align:center;flex:1;min-width:140px;max-width:200px}
.muscle-fig svg{width:100%;height:auto;max-height:160px}
.mf-hip{fill:#d9d3c4;opacity:.55}
.mf-round{stroke:var(--ink);stroke-width:1.5}
.mf-tail{stroke:var(--ink-soft);stroke-width:2;opacity:.4}
.mf-width{stroke:var(--clay);stroke-width:2;stroke-dasharray:3 2}
.muscle-fig figcaption{margin-top:6px}
.muscle-fig figcaption strong{display:block;font-size:16px;color:var(--ink)}
.muscle-fig figcaption span{font-size:12px;color:var(--ink-soft)}
.grades-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 8px}
.gr-card{background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px}
.gr-card h4{font-family:"Barlow Semi Condensed",sans-serif;font-size:16px;margin:0 0 6px;color:var(--ink)}
.gr-card p{font-size:12.5px;color:var(--ink-soft);margin:0;line-height:1.45}
.gr-card.gr-1{border-top:3px solid #8a9b6a}
.gr-card.gr-2{border-top:3px solid #b0a878}
.gr-card.gr-3{border-top:3px solid #c98f6a}
.grades-list{font-size:14px;color:var(--ink);padding-left:20px;margin:8px 0 8px}
.grades-list li{margin-bottom:9px}
.grades-note{background:#f6efe0;border:1.5px solid var(--tag-deep);border-radius:8px;padding:14px 16px;
  font-size:14px;color:var(--ink);margin:22px 0 14px}
.grades-src{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin-top:16px}
@media(max-width:640px){.grades-cards{grid-template-columns:1fr}}
.wt-check-group{display:flex;flex-direction:column;gap:4px}
.wt-check-label{font-family:"Barlow Semi Condensed",sans-serif;font-size:12px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--ink-soft)}
.wt-dropdown{position:relative}
.wt-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:150px;
  font-family:inherit;font-size:14px;padding:7px 11px;border:1.5px solid var(--rule);border-radius:6px;
  background:var(--card);color:var(--ink);cursor:pointer}
.wt-trigger:disabled{opacity:.5;cursor:default}
.wt-trigger.open{border-color:var(--ink)}
.wt-arrow{font-size:11px;color:var(--ink-soft);transition:transform .15s}
.wt-trigger.open .wt-arrow{transform:rotate(180deg)}
.wt-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:170px;max-height:280px;
  overflow-y:auto;background:var(--card);border:1.5px solid var(--rule);border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.14);padding:5px}
.wt-opt{display:flex;align-items:center;gap:7px;font-size:13px;padding:6px 9px;border-radius:5px;
  cursor:pointer;white-space:nowrap}
.wt-opt:hover{background:var(--paper)}
.wt-opt.on{background:var(--tag);font-weight:600}
.wt-opt input{margin:0;width:13px;height:13px;cursor:pointer}
.wt-all-btn{display:block;width:100%;text-align:left;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;padding:6px 9px;margin-bottom:3px;border:none;border-bottom:1px solid var(--rule);
  border-radius:0;background:var(--card);color:var(--clay);font-weight:700;cursor:pointer}
.wt-all-btn:hover{background:var(--paper)}
.hover-cursor{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.hover-pt{stroke:var(--card);stroke-width:1.5}
.ttip-date{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:12px;fill:var(--paper);letter-spacing:.3px}
.ttip-val{font-family:"IBM Plex Sans",sans-serif;font-size:12px;fill:var(--rule)}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.controls label{display:flex;flex-direction:column;gap:4px;font-family:"Barlow Semi Condensed",sans-serif;
  font-weight:600;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft)}
.controls select{font-family:"IBM Plex Sans",sans-serif;font-size:14px;padding:7px 9px;border:1.5px solid var(--ink);
  border-radius:5px;background:var(--card);color:var(--ink);min-width:120px}
.controls select:focus-visible{outline:2px solid var(--tag);outline-offset:1px}
.controls .chk{flex-direction:row;align-items:center;gap:7px;padding-bottom:8px;text-transform:none;
  font-family:"IBM Plex Sans",sans-serif;font-weight:500;font-size:13.5px;letter-spacing:0;color:var(--ink)}
.controls .chk input{width:16px;height:16px;accent-color:var(--tag-deep)}
.tip{position:relative;color:var(--ink-soft);cursor:help;font-size:14px;line-height:1}
.tip:hover::after,.tip:focus-visible::after{content:attr(data-tip);position:absolute;top:145%;left:50%;transform:translateX(-50%);
  width:max-content;max-width:min(280px,calc(100vw - 30px));background:var(--ink);color:var(--paper);
  font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:12.5px;line-height:1.5;
  padding:10px 12px;border-radius:7px;z-index:10;box-shadow:0 3px 10px #00000033}
.tip:focus-visible{outline:2px solid var(--tag);outline-offset:2px;border-radius:50%}
.chart{width:100%;height:auto;background:var(--card);border:1.5px solid var(--rule);border-radius:8px}
.grid{stroke:var(--rule);stroke-width:1}
.grid-100{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:5 4}
.tick{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--ink-soft)}
.tick-l{text-anchor:end}
.tick-r{fill:var(--tag-deep)}
.tick-x{text-anchor:middle;font-size:11.5px}
.axis-name{font-family:"Barlow Semi Condensed",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:1px;fill:var(--ink-soft)}
.axis-name-r{fill:var(--tag-deep)}
.band{fill:var(--steel-soft);stroke:none}
.season-line{fill:none;stroke:var(--steel);stroke-width:2.4;stroke-linejoin:round}
.cur-line{fill:none;stroke:var(--tag);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 1px 1px #00000022)}
.eartag .tag-body{fill:var(--tag);stroke:var(--tag-deep);stroke-width:2.2}
.eartag .tag-hole{fill:var(--paper);stroke:var(--tag-deep);stroke-width:2.2}
.eartag .tag-text{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:19px;
  text-anchor:middle;fill:var(--ink)}
.legend{display:flex;gap:22px;flex-wrap:wrap;margin:10px 2px 4px;font-size:13px;color:var(--ink-soft)}
.legend .sw{display:inline-block;width:20px;height:4px;border-radius:2px;margin-right:7px;vertical-align:middle}
.sw-line{background:var(--steel)}
.sw-band{background:var(--steel-soft);height:10px}
.sw-cur{background:var(--tag)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:13px 15px}
.stat-label{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft)}
.stat-val{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:26px;margin-top:3px}
.stat-val .unit{font-size:13px;color:var(--ink-soft);margin-left:3px}
.stat-val .unit.idx{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  color:var(--ink-soft);background:var(--rule);padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:2px}
.stat-val.hi{color:var(--clay)}
.stat-val.lo{color:var(--grass)}
.stat-note{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.badge{display:inline-block;font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.7px;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:1px}
.badge-lowvol{background:#f3e3c3;color:var(--tag-deep);border:1px solid var(--tag-deep)}
.loading,.empty{padding:44px 20px;text-align:center;color:var(--ink-soft);background:var(--card);
  border:1.5px dashed var(--rule);border-radius:8px;font-family:"IBM Plex Mono",monospace;font-size:13px}
.error{padding:16px 20px;background:#f6e5dd;border:1.5px solid var(--clay);border-radius:8px;color:var(--clay)}
